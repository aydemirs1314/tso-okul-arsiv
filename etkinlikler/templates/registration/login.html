<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — TSO Arşiv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0d1117;
            color: #f0f6fc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            width: 100%;
            max-width: 360px;
            padding: 20px;
            text-align: center;
        }
        .login-logo {
            width: 58px; height: 58px;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: #fff;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(88,166,255,0.25);
        }
        .login-title { font-size: 24px; font-weight: 700; color: #f0f6fc; margin-bottom: 6px; }
        .login-sub { font-size: 14px; color: #9aa4af; margin-bottom: 24px; }

        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .fg { margin-bottom: 18px; }
        .fg label {
            display: block;
            font-size: 13.5px; font-weight: 600; color: #f0f6fc;
            margin-bottom: 8px;
        }
        .fg input {
            width: 100%;
            padding: 10px 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .fg input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88,166,255,0.2);
        }
        .fg input::placeholder { color: #7d8590; }

        .login-btn {
            width: 100%;
            padding: 11px;
            background: #238636;
            color: #fff;
            border: 1px solid rgba(240,246,252,0.1);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }
        .login-btn:hover { background: #2ea043; }

        .error-msg {
            background: rgba(248,81,73,0.15);
            border: 1px solid rgba(248,81,73,0.3);
            color: #ff7b72;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
        }

        .login-footer {
            margin-top: 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            font-size: 13px;
            color: #9aa4af;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo"><i class="fa-solid fa-graduation-cap"></i></div>
        <h1 class="login-title">TSO Arşiv</h1>
        <p class="login-sub">Okul Etkinlik ve Proje Arşiv Sistemi</p>

        <div class="login-card">
            {% if form.errors %}
            <div class="error-msg">
                <i class="fa-solid fa-circle-exclamation me-1"></i> Kullanıcı adı veya şifre hatalı.
            </div>
            {% endif %}

            <form method="post" autocomplete="off">
                {% csrf_token %}
                <div class="fg">
                    <label>Kullanıcı Adı</label>
                    <input type="text" name="username" required autofocus placeholder="Kullanıcı adınızı girin" autocomplete="off">
                </div>
                <div class="fg">
                    <label>Şifre</label>
                    <input type="password" name="password" required placeholder="Şifrenizi girin" autocomplete="new-password">
                </div>
                <button type="submit" class="login-btn">Giriş Yap</button>
            </form>
        </div>
        <div class="login-footer">
            Kullanıcı hesabı oluşturmak için okul yöneticisine başvurun.
        </div>
    </div>
</body>
</html>
